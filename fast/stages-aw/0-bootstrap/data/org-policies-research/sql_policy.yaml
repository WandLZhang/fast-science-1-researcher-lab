---
# Research profile, see compute_policy.yaml.

# Cloud SQL authorized networks can't hold public ranges.
sql.restrictAuthorizedNetworks:
  rules:
    - enforce: true

# Cloud SQL instances can't have public IP addresses.
sql.restrictPublicIp:
  rules:
    - enforce: true
