---
# Research profile, see compute_policy.yaml.

# Only principals from these Cloud Identity or Google Workspace customer IDs
# can be granted IAM roles: this organization's, plus the partner
# organizations in org_policies_config.constraints.allowed_policy_member_domains.
# A department with the tag-scoped orgpolicy.policyAdmin grant from 1-resman
# can add a partner on its own folder with a policy that inherits from the
# parent and allows the partner's customer ID.
iam.allowedPolicyMemberDomains:
  rules:
    - allow:
        values:
          - ${customer_id}
%{ for domain in allowed_domains ~}
          - ${domain}
%{ endfor ~}

# Default App Engine and Compute Engine service accounts get no automatic
# Editor grant.
iam.automaticIamGrantsForDefaultServiceAccounts:
  rules:
    - enforce: true

# No service account keys can be created.
iam.disableServiceAccountKeyCreation:
  rules:
    - enforce: true

# No public keys can be uploaded to service accounts.
iam.disableServiceAccountKeyUpload:
  rules:
    - enforce: true
