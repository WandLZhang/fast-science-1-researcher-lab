# Domain-restricted sharing: only principals from your organization can be
# granted IAM roles on resources in this folder subtree. Blocks accidental
# sharing to gmail.com, contractors at other domains, etc.
#
# iam.managed.allowedPolicyMembers is a managed constraint, so it takes
# enforce plus parameters. The organization principal set covers your
# Workspace or Cloud Identity users and groups, service accounts, and service
# agents. Add allowedMemberSubjects entries for outside identities you trust.
# See: https://docs.cloud.google.com/organization-policy/restrict-domains
name: folders/${DEPARTMENT_FOLDER_ID}/policies/iam.managed.allowedPolicyMembers
spec:
  rules:
  - enforce: true
    parameters:
      allowedPrincipalSets:
      - //cloudresourcemanager.googleapis.com/organizations/${ORG_ID}
